# Go CI. This is the gate that did not exist for v1: lint-test.yml shipped
# disabled by filename and build.yml only ever fired on a tag, so every local
# `ruff`/`pytest` run was the entire quality bar. Landing this before the first
# parser is deliberate -- a port that accumulates unverified code has nothing for
# the differential harness to hang off.
#
# None of it means anything without branch protection requiring these checks.
# That part is a repository setting, not a file in this directory.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating: a lint release that adds a check would otherwise
  # turn an unrelated PR red, and the fix would land under time pressure.
  GOLANGCI_LINT_VERSION: v2.12.2
  GOFUMPT_VERSION: v0.10.0
  # Pinned for the same reason, with one honest caveat: govulncheck reads a live
  # vulnerability database, so this job is non-hermetic whatever version runs. The
  # pin fixes the tool's behaviour, not its verdict -- a new advisory can still
  # redden an untouched PR, and that is the job working correctly.
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
          # -extra merges adjacent same-type parameters, which is the repo's
          # existing style; without it CI and a local run disagree.
          unformatted="$(gofumpt -extra -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofumpt -extra would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

      # A tidy-diff rather than `go mod tidy` followed by a git diff: the former
      # reports the change without writing it, so the job cannot pass by mutating
      # the checkout.
      - name: go mod tidy is up to date
        run: go mod tidy -diff

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      # Per-package floors, not one global percentage. A single repo-wide number
      # lets the TUI's verbosity mask a thinly-tested parser, which is exactly the
      # package where a gap costs a wrong verdict on someone's host.
      #
      # A floor entry names a subtree and is applied to every package in it
      # *individually*, never to their aggregate. Aggregating is the same masking
      # bug one directory down: internal/core=85 over eight combined subpackages
      # would let a well-tested parser carry an untested one.
      #
      # A floor whose subtree has no packages yet is reported as skipped rather
      # than passing quietly -- a silently-unenforced floor is worse than none,
      # because it reads as covered.
      - name: Coverage floors
        run: |
          set -eu
          # A quoted heredoc, not floors="...", because the list carries prose and
          # prose carries quotes. The pytime note below ends in the words "never
          # started" -- inside a double-quoted assignment that first quote closed
          # the string, and the shell went on to run the rest of the list as a
          # command (exit 127, every floor unchecked). <<'EOF' has no metacharacters
          # at all, so a comment can say anything.
          floors=$(cat <<'EOF'
          internal/core=85
          internal/pytext=95
          # Same class as pytext, and for the same reason: it is Python's
          # datetime.fromisoformat, whose accept/reject boundary was measured
          # against the interpreter rather than read off the documentation. An
          # untested branch is a container start time that silently reads as
          # "never started".
          internal/pytime=95
          internal/audit=90
          internal/updater=85
          # High, because this package is a dialect emulation: it reproduces
          # PyYAML's constructors so an operator's existing probes.yml keeps
          # meaning what it meant, and an untested branch there is a threshold
          # override that silently reads as something else.
          internal/config=90
          internal/cli=90
          # A leaf package of pure arithmetic that decides whether a host pages
          # anyone. Every bound in it was measured off v1's own severity
          # functions, and an untested branch is a fleet that stays green.
          internal/threshold=95
          # The contract all three front doors share. It is small, has no I/O, and
          # every branch in it decides what a consumer is told -- a status that
          # ranks wrong or a slice that marshals to null is a fleet-wide wire bug.
          internal/check=95
          # The published JSON contract. Nothing outside this repository can be
          # fixed by a later release once a consumer pins on it, so every branch
          # that decides a key, a type or an ordering is worth the floor.
          internal/report=95
          internal/cmdrun=95
          internal/hostfs=95
          internal/logging=95
          internal/release=95
          internal/version=90
          # Not shipped, but the differential harness is what proves the forty
          # parsers match Python -- a comparator with a hole in it passes
          # everything and says so confidently.
          tools/ffdiff=85
          EOF
          )
          # One pass over the profile, weighted over statements, grouped by package
          # directory. Read from the profile rather than from `go tool cover -func`:
          # that command prints a percentage per function, and averaging those would
          # weight a one-line accessor the same as a hundred-line parser.
          #
          # Profile rows are: import/path/file.go:startLine.col,endLine.col nStmts count
          #
          # cmd/ subtrees are excluded. A main package is stream wiring around an
          # os.Exit, which cannot be covered in-process at all; leaving it in would
          # let two uncoverable lines hold a well-tested package below its floor.
          # Those binaries are proven by the smoke and release jobs actually
          # running them, which is stronger than a coverage number.
          awk '
            $0 ~ /^mode:/ { next }
            index($1, "/cmd/") { next }
            {
              dir = $1
              sub(/:[0-9]+\.[0-9]+,.*$/, "", dir)
              sub(/\/[^/]*$/, "", dir)
              total[dir] += $2
              if ($3 > 0) { covered[dir] += $2 }
            }
            END {
              for (d in total) { printf "%s %.1f\n", d, 100 * covered[d] / total[d] }
            }' coverage.out | sort > per-package-coverage.txt
          # Strip comments and whitespace before splitting. `for entry in $floors`
          # splits on every space, so each word of a comment in the list above
          # became its own entry -- twelve bogus "not enforced" notices burying
          # the two real ones, and a comment word containing '=' would have become
          # a phantom floor on a package that does not exist.
          entries="$(printf '%s\n' "$floors" | sed -e 's/#.*$//' -e 's/[[:space:]]//g' -e '/^$/d')"
          if [ -z "$entries" ]; then
            echo "::error::the floor list is empty; no coverage floor was enforced"
            exit 1
          fi
          fail=0
          # A floor naming a package that does not exist is only a notice, so that a
          # floor can be written before the package is. That tolerance is also the
          # hole: if every floor stopped matching -- the list mangled, or the awk
          # output changing shape -- the job would print notices and pass. Counting
          # the floors that actually got enforced closes it.
          enforced=0
          for entry in $entries; do
            pkg="${entry%=*}"
            min="${entry#*=}"
            # A malformed entry fails rather than being skipped. A floor that is
            # silently ignored reads exactly like one that passed.
            case "$entry" in
              *=*) ;;
              *)
                echo "::error::floor entry is not pkg=percent: ${entry}"
                fail=1
                continue
                ;;
            esac
            case "$min" in
              '' | *[!0-9]*)
                echo "::error::floor for ${pkg} is not a whole percentage: ${min}"
                fail=1
                continue
                ;;
            esac
            matched=0
            while read -r dir pct; do
              # Segment-anchored so internal/cli does not also claim a package
              # called internal/client.
              case "/${dir}/" in
                */"${pkg}"/*) ;;
                *) continue ;;
              esac
              matched=1
              if awk -v a="$pct" -v b="$min" 'BEGIN { exit !(a + 0 >= b + 0) }'; then
                echo "ok  ${dir}: ${pct}% (floor ${min}%)"
              else
                echo "::error::${dir}: ${pct}% is below the ${min}% floor for ${pkg}"
                fail=1
              fi
            done < per-package-coverage.txt
            if [ "$matched" -eq 0 ]; then
              echo "::notice::no coverage rows under ${pkg}; floor of ${min}% not enforced (no such package yet)"
            else
              enforced=$((enforced + 1))
            fi
          done
          if [ "$enforced" -eq 0 ]; then
            echo "::error::no floor matched any package; the coverage gate checked nothing"
            fail=1
          fi
          exit "$fail"

  fuzz:
    # A short smoke, not a fuzzing campaign. Its job is to catch a target that no
    # longer compiles or that fails on its own seed corpus -- the two ways a fuzz
    # target silently stops testing anything.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz every target briefly
        run: |
          set -eu
          found=0
          for pkg in $(go list ./...); do
            targets="$(go test -list='Fuzz.*' "$pkg" 2>/dev/null | grep '^Fuzz' || true)"
            for target in $targets; do
              found=$((found + 1))
              echo "--- $pkg $target"
              go test -run='^$' -fuzz="^${target}\$" -fuzztime=15s "$pkg"
            done
          done
          # Announced rather than assumed: a discovery loop that quietly finds
          # nothing is indistinguishable from a passing fuzz run.
          echo "fuzzed ${found} target(s)"

  build:
    # The static-linking claim, checked per architecture. PyInstaller pinned v1 to
    # a glibc floor and needed a writable /tmp; if these binaries are not actually
    # static then the whole reason for the port is unverified.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o fleetfix ./cmd/fleetfix

      - name: Assert the binary is static
        run: |
          set -eu
          file fleetfix
          # readelf works across architectures, which ldd does not reliably do: a
          # foreign-arch binary makes ldd exercise the host's loader. A static ELF
          # has no DT_NEEDED entries at all.
          if readelf -d fleetfix 2>/dev/null | grep -q NEEDED; then
            echo "::error::fleetfix (${{ matrix.goarch }}) links shared libraries:"
            readelf -d fleetfix
            exit 1
          fi
          file fleetfix | grep -q 'statically linked' || {
            echo "::error::file(1) does not call the binary statically linked"
            exit 1
          }

      # The plan's exit gate names this exact string, so it is asserted literally
      # on the architecture where ldd is trustworthy.
      - name: ldd reports no dynamic executable (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          out="$(ldd fleetfix 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q 'not a dynamic executable'

  smoke:
    # Runs the amd64 binary on the oldest glibc we support and on musl, as root and
    # as an unprivileged user. v1 could not do this at all: the PyInstaller onefile
    # unpacks into /tmp and pins a glibc floor, so Alpine and read-only hosts were
    # simply out of reach. The claim is now testable, so it gets tested.
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:11
          - ubuntu:22.04
          - ubuntu:24.04
          - alpine:3.20
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/fleetfix ./cmd/fleetfix

      - name: Run as root
        run: |
          set -eu
          /tmp/fleetfix --version
          # check exits 3 in this build (nothing is registered yet), so the exit
          # code is asserted rather than relied on to be zero.
          set +e
          out="$(/tmp/fleetfix check --json)"
          code=$?
          set -e
          test "$code" = "3" || { echo "::error::check exited $code, want 3"; exit 1; }
          echo "$out" | grep -q '"schema"'

      - name: Run as an unprivileged user
        run: |
          set -eu
          # Both distro families, without assuming which useradd is present.
          if command -v useradd >/dev/null 2>&1; then
            useradd -m probe || true
          else
            adduser -D probe || true
          fi
          chmod 0755 /tmp/fleetfix
          su probe -c '/tmp/fleetfix --version'
          su probe -c '/tmp/fleetfix check --json > /dev/null; test $? = 3'
